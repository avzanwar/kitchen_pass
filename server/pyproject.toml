[project]
name = "kitchen-pass-server"
version = "0.1.0"
description = "Pickleball tournament manager — API and scoring engine"
requires-python = ">=3.12"
dependencies = [
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.35",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2.1",
    "python-slugify>=8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
# Autogenerated by `alembic revision --autogenerate`; regenerating would undo
# any hand-formatting, so it is not worth linting.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
exclude = ["alembic/"]

# redis is optional: the hub falls back to in-process fan-out without it.
[[tool.mypy.overrides]]
module = ["redis.*"]
ignore_missing_imports = true
