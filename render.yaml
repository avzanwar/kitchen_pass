# Render blueprint: one free web service, backed by an external Postgres.
#
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repository.
#
# The database is deliberately NOT provisioned here. Render's free Postgres is
# deleted after 30 days, which is a bad surprise for anything you want to keep.
# Point KP_DATABASE_URL at a free Neon database instead — see README.
#
# Free-tier caveat that remains: the service sleeps after 15 minutes idle, and
# the next request takes 30-60 seconds to wake it.

services:
  - type: web
    name: kitchen-pass
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      # Render generates a strong value; the app refuses to boot without one.
      - key: KP_SECRET_KEY
        generateValue: true

      # sync: false means "prompt me for this, do not store it in the repo".
      # Paste the Neon pooled connection string here when Render asks.
      - key: KP_DATABASE_URL
        sync: false

      - key: KP_DEBUG
        value: "false"

      # Loads the demo tournament on first boot only, into an empty database.
      # Set to "false" once real data exists and you no longer want the demo.
      - key: KP_SEED_ON_START
        value: "true"
